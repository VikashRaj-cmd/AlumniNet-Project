version: '3.8'

services:
  # ─── MONGODB DATABASE SERVICE ──────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: alumninet-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: alumninet
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - alumninet-network

  # ─── REDIS CACHE SERVICE ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: alumninet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - alumninet-network

  # ─── BACKEND EXPRESS API SERVICE ──────────────────────────────────
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: alumninet-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/alumninet
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=alumninet_super_secret_jwt_key_2026_prod
      - JWT_ACCESS_EXPIRE=15m
      - JWT_REFRESH_DAYS=7
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alumninet-network

  # ─── FRONTEND REACT NGINX SERVICE ────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: alumninet-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - alumninet-network

# ─── PERSISTENT VOLUMES ─────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

# ─── NETWORKS ───────────────────────────────────────────────────────
networks:
  alumninet-network:
    driver: bridge
